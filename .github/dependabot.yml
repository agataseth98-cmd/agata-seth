# Atualização de dependências, candidato 16/10/2026 (Fase I, I2): carência antes de abrir PR de
# versão, porque a maioria dos ataques à cadeia de suprimentos dura menos de uma semana. Atualização
# de SEGURANÇA fura a carência por desenho do Dependabot. Só `github-actions` por enquanto: é o único
# ecossistema versionado que o repositório declara.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # Versão MAIOR de uma action muda comportamento do CI e mexe em workflow protegido: entra só por proposta
    # assinada, não por PR automático (o fiscal-p8 barraria o PR de qualquer forma; ver PR 234, fechado em 16/10/2026).
    # Não afeta atualizações de SEGURANÇA, que seguem abrindo PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
