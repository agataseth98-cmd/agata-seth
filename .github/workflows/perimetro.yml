# Segunda linha de enforcement independente -- item 7 do plano de mitigação
# da auditoria do Marcos (MEMÓRIAS (437)). Até aqui, só o hook `pre-commit`
# na Máquina do Humano revalidava um commit; nada revalidava DEPOIS do push,
# fora dessa mesma Máquina. Roda a MESMA suíte adversarial dos controles
# (scripts/testar_perimetro.sh) num runner do GitHub -- mecanismo que não
# roda no computador do Humano, não pode ser desligado por engano junto com
# um serviço local, e não compartilha nada do ambiente que gerou o commit.
#
# Escopo deliberado: só os controles nível L1 (clone/offline -- ver
# scripts/testar_perimetro.sh, "niveis"). L2-L5 (systemd vivo, root, rede
# real, HD de backup) não existem num runner efêmero -- não é lacuna
# escondida, é a mesma fronteira que a própria suíte já declara há dias.
name: Perímetro (segunda linha independente)

# Menor privilégio (candidato 16/10/2026): este workflow só lê o repositório.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  suite-adversarial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0, fixado por SHA em 16/10/2026
        with:
          fetch-depth: 0

      - name: Configura git (a suíte clona o próprio repo e comita nos testes)
        run: |
          git config --global user.email "ci@agata.local"
          git config --global user.name "Agata CI"

      - name: Suíte adversarial dos controles (nível L1 -- clone/offline)
        run: bash scripts/testar_perimetro.sh

      # (688) Pedido do Humano na pergunta 3 do portão de (685): a checagem de
      # estilo e a voz comum falhavam caladas -- os selftests só rodavam à mão.
      # Sem rede e sem segredo: os três usam só o checkout (SETH_REPO).
      - name: Selftests da Seth (auditoria do turno, gateway, Conselho)
        env:
          SETH_REPO: ${{ github.workspace }}
        run: |
          python3 redesign/router/auditoria_turno.py --selftest
          python3 redesign/router/seth_gateway.py --selftest
          python3 scripts/conselho_remoto.py --selftest

      # Candidato 16/10/2026: o auxiliar de integralidade e o fiscal de PR são testados aqui, contra o
      # CÓDIGO DO PR e sem privilégio algum (job `pull_request`). Quem fiscaliza de verdade é o job
      # `fiscal-p8` de fiscal-p8.yml, que roda a versão do `main`.
      - name: Selftests do fiscal P-8 (integralidade e PR)
        run: |
          python3 -I scripts/p8_integral.py --selftest
          python3 -I scripts/testar_p8_verificar_pr.py
          python3 -I scripts/painel_estado.py --selftest

      - name: Contratos de memória e escriba (offline, stdlib)
        run: |
          python3 -I scripts/testar_memoria_leitura.py
          python3 -I scripts/testar_trava_escriba.py
