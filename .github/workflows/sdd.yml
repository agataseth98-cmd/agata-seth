# Ciclo SDD na CI: repete, fora da Máquina, o que o ciclo local confere.
# Só lê o repositório; não assina, não aplica, não mergeia.
name: SDD (ciclo mecânico)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "redesign/sdd_flow/**"
      - "redesign/review_mesh/**"
      - "redesign/project_kit/**"
      - "redesign/evidence_ledger/**"
      - "redesign/nova_versao/**"
      - "redesign/confiabilidade/**"
      - "redesign/rotas/**"
      - "redesign/mvp_autoaprimoramento/**"
      - "redesign/alexandria/**"
      - "redesign/metacognicao/**"
      - "redesign/corpo/**"
      - "redesign/conexoes/**"
      - "redesign/avaliacao/**"
      - "redesign/sentidos/**"
      - "redesign/router/sombra_nova_versao.py"
      - "ferramentas/**"
      - "scripts/busca_texto.py"
      - "redesign/painel_operacional/**"
      - "redesign/obsidian/**"
      - ".agents/skills/**"
      - "scripts/medir_*.py"
      - "scripts/agata_falar.py"
      - "scripts/gate_spec_sync.py"
      - "scripts/turno.py"
      - "scripts/testar_turno.py"
      - "scripts/auditoria_stop.py"
      - "scripts/conselho_mecanismos.py"
      - "scripts/testar_mecanismos.py"
      - "redesign/router/auditoria_turno.py"
      - "redesign/router/spec/**"
      - "redesign/router/seth_gateway.py"
      - ".claude/**"
      - ".github/workflows/sdd.yml"
  workflow_dispatch: {}

jobs:
  sdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, fixado por SHA como em perimetro.yml
        with:
          fetch-depth: 0  # o gate de sincronia compara datas de commit: precisa do histórico inteiro

      - name: pytest fixado
        run: python3 -m pip install --disable-pip-version-check pytest==9.2.0

      - name: Testes dos componentes SDD
        run: python3 -m pytest -q redesign/sdd_flow/tests redesign/review_mesh redesign/project_kit redesign/evidence_ledger redesign/painel_operacional redesign/obsidian redesign/nova_versao/tests redesign/alexandria/tests redesign/metacognicao/tests redesign/corpo/tests redesign/conexoes/tests redesign/avaliacao/tests redesign/sentidos/tests redesign/confiabilidade/tests redesign/rotas/tests redesign/mvp_autoaprimoramento/tests ferramentas/test_ferramentas.py

      - name: Gate de sincronia das specs (antes dos ciclos, que regeneram o drift)
        run: |
          python3 -I scripts/gate_spec_sync.py --selftest
          python3 -I scripts/gate_spec_sync.py

      - name: Ciclo SDD sobre o próprio sdd_flow
        run: python3 redesign/sdd_flow/runner.py "$RUNNER_TEMP/state.json" cycle redesign/sdd_flow/spec redesign/sdd_flow/spec/acceptance.json --scope redesign/sdd_flow

      - name: Ciclo SDD sobre a spec-mãe da nova versão (Experimento GPT)
        run: python3 redesign/sdd_flow/runner.py "$RUNNER_TEMP/state-nv.json" cycle redesign/nova_versao/spec redesign/nova_versao/spec/acceptance.json --scope redesign/nova_versao

      - name: Âncora e critérios dos componentes existentes
        run: |
          python3 redesign/sdd_flow/anchor.py . redesign/sdd_flow redesign/project_kit redesign/review_mesh redesign/evidence_ledger redesign/painel_operacional redesign/nova_versao redesign/alexandria redesign/metacognicao redesign/corpo redesign/conexoes redesign/avaliacao redesign/sentidos
          for c in project_kit review_mesh evidence_ledger painel_operacional nova_versao alexandria metacognicao corpo conexoes avaliacao sentidos; do
            python3 redesign/sdd_flow/acceptance_runner.py "redesign/$c/spec/acceptance.json" "$RUNNER_TEMP/$c-evidence.json"
            python3 redesign/sdd_flow/criterion_drift.py "redesign/$c/spec/spec.md" "$RUNNER_TEMP/$c-evidence.json" "$RUNNER_TEMP/$c-drift.md"
          done

      - name: Indicadores de qualidade de LLM (selftest e leitura das skills)
        run: |
          python3 -I redesign/painel_operacional/qualidade_llm.py --selftest
          python3 redesign/painel_operacional/qualidade_llm.py > "$RUNNER_TEMP/qualidade.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); bad=[s for s in d['skills'] if s['problemas']]; print('skills com problema:', [(s['skill'], s['problemas']) for s in bad]); sys.exit(1 if bad else 0)" "$RUNNER_TEMP/qualidade.json"

      - name: Medições de LLM (selftests offline)
        run: |
          python3 -I scripts/medir_recuperacao.py --selftest
          python3 -I scripts/medir_contexto_efetivo.py --selftest
          python3 -I scripts/teste_portugues.py --selftest

      - name: Voz do sistema (selftest offline)
        run: python3 -I scripts/agata_falar.py --selftest

      - name: Projeto SDD declarativo (selftest offline)
        run: python3 -I redesign/sdd_flow/project.py --selftest

      - name: Pacote mecânico (turno, gancho Stop, mecanismos do Conselho)
        run: |
          python3 scripts/testar_turno.py
          python3 scripts/turno.py --selftest
          python3 redesign/router/auditoria_turno.py --selftest
          python3 scripts/testar_mecanismos.py
          python3 scripts/conselho_mecanismos.py --verificar
