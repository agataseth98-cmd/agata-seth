# Ciclo SDD na CI: repete, fora da Máquina, o que o ciclo local confere.
# Só lê o repositório; não assina, não aplica, não mergeia.
name: SDD (ciclo mecânico)

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "redesign/sdd_flow/**"
      - "redesign/review_mesh/**"
      - "redesign/project_kit/**"
      - "redesign/evidence_ledger/**"
      - "redesign/painel_operacional/**"
      - "redesign/obsidian/**"
      - ".agents/skills/**"
      - "scripts/medir_*.py"
      - "scripts/agata_falar.py"
      - ".github/workflows/sdd.yml"
  workflow_dispatch: {}

jobs:
  sdd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, fixado por SHA como em perimetro.yml

      - name: pytest fixado
        run: python3 -m pip install --disable-pip-version-check pytest==9.2.0

      - name: Testes dos componentes SDD
        run: python3 -m pytest -q redesign/sdd_flow/tests redesign/review_mesh redesign/project_kit redesign/evidence_ledger redesign/painel_operacional redesign/obsidian

      - name: Ciclo SDD sobre o próprio sdd_flow
        run: python3 redesign/sdd_flow/runner.py "$RUNNER_TEMP/state.json" cycle redesign/sdd_flow/spec redesign/sdd_flow/spec/acceptance.json --scope redesign/sdd_flow

      - name: Âncora e critérios dos componentes existentes
        run: |
          python3 redesign/sdd_flow/anchor.py . redesign/sdd_flow redesign/project_kit redesign/review_mesh redesign/evidence_ledger redesign/painel_operacional
          for c in project_kit review_mesh evidence_ledger painel_operacional; do
            python3 redesign/sdd_flow/acceptance_runner.py "redesign/$c/spec/acceptance.json" "$RUNNER_TEMP/$c-evidence.json"
            python3 redesign/sdd_flow/criterion_drift.py "redesign/$c/spec/spec.md" "$RUNNER_TEMP/$c-evidence.json" "$RUNNER_TEMP/$c-drift.md"
          done

      - name: Indicadores de qualidade de LLM (selftest e leitura das skills)
        run: |
          python3 -I redesign/painel_operacional/qualidade_llm.py --selftest
          python3 redesign/painel_operacional/qualidade_llm.py > "$RUNNER_TEMP/qualidade.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); bad=[s for s in d['skills'] if s['problemas']]; print('skills com problema:', [(s['skill'], s['problemas']) for s in bad]); sys.exit(1 if bad else 0)" "$RUNNER_TEMP/qualidade.json"

      - name: Medições de LLM (selftests offline)
        run: |
          python3 -I scripts/medir_recuperacao.py --selftest
          python3 -I scripts/medir_contexto_efetivo.py --selftest

      - name: Voz do sistema (selftest offline)
        run: python3 -I scripts/agata_falar.py --selftest
