# ~/librechat/docker-compose.yml
# LibreChat ENXUTO para o sistema Agata -- 3 servicos, nada mais.
#   librechat-mongodb      conversas / usuarios / presets (rede de dados isolada)
#   librechat-meilisearch  busca de conversa (rede de dados isolada)
#   librechat              a app (api + cliente)
#
# NAO tem rag_api nem pgvector de proposito (MEMORIAS (115)/(293): sem busca por embedding).
# B8 / ISO-05 (auditoria de Marcos; MEMORIAS (532)): a app NAO usa mais
# network_mode:host -- antes ela enxergava TODA a rede local da Maquina (qualquer
# porta), nao so as que precisa. Agora fica na bridge `librechat` (subnet fixa
# 172.29.7.0/24) e so alcanca a Maquina pelo `librechat-ponte-host`: um container
# minusculo (socat, sem interpretador de proposito geral) em network_mode:host que
# encaminha SO as 7 portas que a app usa, a partir do gateway da bridge (172.29.7.1):
#   20126 seth_gateway · 8890 piper-tts · 27125 obsidian-ro-proxy (canon)
#   20135 discord-mcp · 20136 navegador-mcp · 20140 seth_escriba · 20141 seth_verificador
# A tentativa de 21/09 cobria 4 e esqueceu escriba/verificador/piper -- e o
# librechat.yaml meio-convertido derrubou a Seth em 22/09 ((517)). Porta nova que a
# app precise = entra aqui E no librechat.yaml, nos dois, no mesmo commit.
# Mongo/Meili: a app fala com eles pelo NOME do servico, dentro da bridge.
#
# restart: unless-stopped em tudo (18/10/2026): antes era "no" e, depois da queda de
# energia desse dia, os 4 containers sairam com 255 e nao voltaram. Agora o dockerd os
# religa no boot; `Parar Seth` (`compose stop`) continua valendo -- container parado
# a mao fica parado, inclusive depois de reiniciar a Maquina.
# Fonte versionada: ~/agata/redesign/librechat/docker-compose.yml

services:
  librechat-mongodb:
    container_name: librechat-mongodb
    image: mongo:8.0.20@sha256:098862b1339f031900ca66cf8fef799e616d6324fa41b9a263f2ec899552c1ef
    restart: unless-stopped
    networks: [librechat-data]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - librechat-mongo-data:/data/db

  librechat-meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.35.1@sha256:8b57fc3c7f46535ddef3828df1538465ac19d892eb57c9a10da6df0880bd5856
    restart: unless-stopped
    networks: [librechat-data]
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - librechat-meili-data:/meili_data

  librechat-ponte-host:
    container_name: librechat-ponte-host
    image: alpine/socat:1.8.0.1@sha256:87d88ff79bf42ca723fb360e9585c40e2923a2f4df9b9d148b127568ef6b99e7
    restart: unless-stopped
    network_mode: host
    depends_on:
      - librechat-mongodb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for p in 20126 8890 27125 20135 20136 20140 20141; do
          socat TCP-LISTEN:$$p,bind=172.29.7.1,fork,reuseaddr TCP:127.0.0.1:$$p &
        done
        wait

  librechat:
    container_name: librechat
    build:
      context: .
      dockerfile: Dockerfile
    image: agata-librechat:capabilities-20261020
    # GID exclusivo da montagem privada (host: root:59999, 0440); a aplicação
    # continua UID 1000 para escrever nos volumes dela.
    user: "${AGATA_LIBRECHAT_UID:-1000}:${AGATA_LIBRECHAT_GID:-59999}"
    # A imagem derivada é montada de forma reprodutível no Dockerfile: imagem
    # upstream pinada por digest + patch versionado do fork Agata em `fork/`.
    # O patch altera o emissor de capabilities e a ligação com a aprovação real.
    # Não usar `docker pull` para substituir a imagem derivada por upstream.
    restart: unless-stopped
    networks: [librechat, librechat-data]
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - librechat-mongodb
      - librechat-meilisearch
      - librechat-ponte-host
    env_file:
      - .env
    # Tema da Agata (MEMÓRIAS (670)): o CSS montado abaixo entra por um <link> no
    # index.html, acrescentado aqui antes de subir (idempotente; o LibreChat lê o
    # index.html uma vez no boot). Os .br/.gz pré-comprimidos do index saem para
    # nunca servir a versão sem o tema. O resto é o comando original da imagem.
    command:
      - sh
      - -c
      - >-
        grep -q agata-tema.css client/dist/index.html ||
        sed -i 's#</head>#<link rel="stylesheet" href="/assets/agata-tema.css"></head>#' client/dist/index.html;
        rm -f client/dist/index.html.br client/dist/index.html.gz;
        exec npm run backend
    environment:
      - CONFIG_PATH=/app/librechat.yaml
      - AGATA_APPROVAL_PRIVATE_PEM_PATH=/run/secrets/agata-approval-private.pem
      # sobrepõem o .env (que vale pro modo host antigo): dentro da bridge a app
      # escuta em todas as interfaces DO CONTAINER -- na Maquina so 127.0.0.1:3080
      # e publicado (acima) -- e acha Mongo/Meili pelo nome do servico.
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
      - MEILI_HOST=http://librechat-meilisearch:7700
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./data:/app/data
      - ${HOME}/.config/agata/approval-capability-private.pem:/run/secrets/agata-approval-private.pem:ro
      - ./agata-tema.css:/app/client/dist/assets/agata-tema.css:ro
    healthcheck:
      # /health é o mesmo endpoint que ~/.local/bin/seth já usa pra saber
      # quando abrir o navegador -- reusado aqui, não inventado.
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:3080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  librechat:
    name: librechat
    # Nome FIXO da interface (MEMÓRIAS (538)): a regra do ufw que libera as 7 portas
    # do rele casa por interface (`in on br-librechat`); com o nome aleatorio do
    # docker (br-<hash>) a regra quebraria a cada recriacao da rede. Na 1a tentativa
    # (532) o ufw bloqueou tudo justamente por falta dessa regra.
    driver_opts:
      com.docker.network.bridge.name: br-librechat
    ipam:
      config:
        - subnet: 172.29.7.0/24
          gateway: 172.29.7.1
  librechat-data:
    name: librechat-data
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.8.0/24
          gateway: 172.29.8.1

volumes:
  librechat-mongo-data:
  librechat-meili-data:
