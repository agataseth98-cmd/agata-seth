# ~/librechat/docker-compose.yml
# LibreChat ENXUTO para o sistema Agata -- 3 servicos, nada mais.
#   librechat-mongodb      conversas / usuarios / presets
#   librechat-meilisearch  busca de conversa
#   librechat              a app (api + cliente)
#
# NAO tem rag_api nem pgvector de proposito (MEMORIAS (115)/(293): sem busca por embedding).
# B8 / ISO-05 (auditoria de Marcos; MEMORIAS (532)): a app NAO usa mais
# network_mode:host -- antes ela enxergava TODA a rede local da Maquina (qualquer
# porta), nao so as que precisa. Agora fica na bridge `librechat` (subnet fixa
# 172.29.7.0/24) e so alcanca a Maquina pelo `librechat-ponte-host`: um container
# minusculo (socat, sem interpretador de proposito geral) em network_mode:host que
# encaminha SO as 7 portas que a app usa, a partir do gateway da bridge (172.29.7.1):
#   20126 seth_gateway · 8890 piper-tts · 27125 obsidian-ro-proxy (canon)
#   20135 discord-mcp · 20136 navegador-mcp · 20140 seth_escriba · 20141 seth_verificador
# A tentativa de 21/09 cobria 4 e esqueceu escriba/verificador/piper -- e o
# librechat.yaml meio-convertido derrubou a Seth em 22/09 ((517)). Porta nova que a
# app precise = entra aqui E no librechat.yaml, nos dois, no mesmo commit.
# Mongo/Meili: a app fala com eles pelo NOME do servico, dentro da bridge.
#
# restart:"no" em tudo -- nada sobe no boot. Os atalhos `seth` / `Parar Seth` controlam.
# Fonte versionada: ~/agata/redesign/librechat/docker-compose.yml

services:
  librechat-mongodb:
    container_name: librechat-mongodb
    image: mongo:8.0.20
    restart: "no"
    networks: [librechat]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - librechat-mongo-data:/data/db

  librechat-meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: "no"
    networks: [librechat]
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - librechat-meili-data:/meili_data

  librechat-ponte-host:
    container_name: librechat-ponte-host
    image: alpine/socat:1.8.0.1
    restart: "no"
    network_mode: host
    depends_on:
      - librechat-mongodb
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for p in 20126 8890 27125 20135 20136 20140 20141; do
          socat TCP-LISTEN:$$p,bind=172.29.7.1,fork,reuseaddr TCP:127.0.0.1:$$p &
        done
        wait

  librechat:
    container_name: librechat
    # Pin por digest, não por tag (achado (328), sem pin/healthcheck; corrigido
    # 05/09/2026, MEMÓRIAS (341)) -- digest da imagem real testada e em uso
    # nesta Máquina no momento do pin (docker inspect librechat, 05/09/2026).
    # Subir de propósito, não sem querer: `docker pull ...:latest` +
    # `docker inspect --format='{{index .RepoDigests 0}}'` pra pegar o novo
    # digest, testar, só então trocar aqui.
    # Atualizado 21/09/2026 (MEMÓRIAS (487)) -- tag v0.8.8-rc3, pra ganhar o
    # HITL tool approval (endpoints.agents.toolApproval acima). É release
    # candidate, não versão estável -- não existe v0.8.8 oficial ainda
    # (conferido na API do Docker Hub). Testado numa cópia isolada antes de
    # trocar aqui: boot limpo com esta mesma config, aprovação/rejeição de
    # ferramenta confirmadas funcionando.
    image: ghcr.io/danny-avila/librechat@sha256:b07248d86e020c44101170bde2dbb4ab547df30dd223b4aacd6218cc90e8632b
    restart: "no"
    networks: [librechat]
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - librechat-mongodb
      - librechat-meilisearch
      - librechat-ponte-host
    env_file:
      - .env
    environment:
      - CONFIG_PATH=/app/librechat.yaml
      # sobrepõem o .env (que vale pro modo host antigo): dentro da bridge a app
      # escuta em todas as interfaces DO CONTAINER -- na Maquina so 127.0.0.1:3080
      # e publicado (acima) -- e acha Mongo/Meili pelo nome do servico.
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://librechat-mongodb:27017/LibreChat
      - MEILI_HOST=http://librechat-meilisearch:7700
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./data:/app/data
    healthcheck:
      # /health é o mesmo endpoint que ~/.local/bin/seth já usa pra saber
      # quando abrir o navegador -- reusado aqui, não inventado.
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:3080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  librechat:
    name: librechat
    # Nome FIXO da interface (MEMÓRIAS (538)): a regra do ufw que libera as 7 portas
    # do rele casa por interface (`in on br-librechat`); com o nome aleatorio do
    # docker (br-<hash>) a regra quebraria a cada recriacao da rede. Na 1a tentativa
    # (532) o ufw bloqueou tudo justamente por falta dessa regra.
    driver_opts:
      com.docker.network.bridge.name: br-librechat
    ipam:
      config:
        - subnet: 172.29.7.0/24
          gateway: 172.29.7.1

volumes:
  librechat-mongo-data:
  librechat-meili-data:
