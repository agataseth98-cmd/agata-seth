# librechat.yaml -- config do LibreChat do sistema Agata.
# Fonte versionada: ~/agata/redesign/librechat/librechat.yaml
# Runtime: ~/librechat/librechat.yaml  (montado em /app/librechat.yaml :ro)
#
# Principios espelhados do sistema:
#  - memoria DESLIGADA: a hidratacao da Seth vem do seth_gateway (:20126),
#    que injeta canon-em-git verificavel. Nada de auto-captura por LLM (MEMORIAS (312)).
#  - SEM RAG por embedding: MEMORIAS (115)/(293) recusaram busca semantica.
#    O rag_api e o pgvector nao sao implantados.
#  - um unico endpoint "Seth" -> :20126 (loopback: seth_gateway -> sanitizador -> OmniRoute).

version: 1.3.13
cache: true

# Servidores MCP remotos (discord/navegador, skills novas 05/09/2026) rodam na
# Maquina em 127.0.0.1; a app (bridge `librechat`, B8 -- MEMORIAS (532)) os alcança
# via 172.29.7.1, o gateway da bridge, pelo rele `librechat-ponte-host`. Sem esta
# lista, o LibreChat bloqueia qualquer server MCP com `url:` por seguranca (SSRF).
mcpSettings:
  allowedDomains:
    - "127.0.0.1"
    - "172.29.7.1"   # gateway da bridge `librechat` -> librechat-ponte-host (B8, MEMÓRIAS (532))

interface:
  mcpServers:
    use: true
  customWelcome: "Seth -- sistema Agata. Hidratada pelo seth_gateway (:20126). A Regra 1 vale: toda resposta abre com modelo - turno - ultima entrada de MEMORIAS - o que esta quebrado."
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""

registration:
  socialLogins: []

# modelSpecs com enforce (MEMÓRIAS (392)): o LibreChat guarda no localStorage do
# navegador o ultimo modelo escolhido -- uma escolha velha (ex.: um `llama-3.2-11b`
# fantasma dos ~300 do catalogo cru, de antes do `fetch: false`) sobrevive a
# mudanca de yaml e a Seth abre com "modelo nao disponivel". `enforce: true` faz
# o yaml VENCER o localStorage: a UI so oferece estas specs, `seth-livre` e' o
# default automatico, e o estado velho do navegador e' ignorado. As 4 concretas
# ficam como troca manual (fallback quando um provedor cai). `auto/best-free`
# fica como opcao, pra quando o auto-roteador do OmniRoute se recuperar.
modelSpecs:
  enforce: true
  prioritize: true
  list:
    # iconURL em TODAS as specs: com `enforce: true` a Seth aparece sempre via
    # spec, e spec sem `iconURL` cai no icone generico.
    # Corrigido 21/09/2026 (MEMORIAS (498)): `/images/seth.png`, servido direto
    # da raiz do bind-mount, parou de funcionar no v0.8.8-rc3 -- a nova rota
    # /images/ (createValidateImageRequest, secureImageLinks:true por padrao)
    # so autoriza caminho `/images/<userId ObjectId>/...`, e um arquivo solto
    # na raiz nunca bate esse regex (403 sempre, independente de estar
    # logado). O Agent da Seth (`agent_4KlxSMeX5Y8cWQVODkJfH`) JA TINHA um
    # avatar de verdade, ligado no Mongo (`avatar.filepath`) -- esse caminho
    # passa na validacao (200, testado real). Trocamos o iconURL das specs
    # pra apontar pra ELE, em vez de recriar outro arquivo.
    #
    # Agent RECRIADO em (415): `agent_4KlxSMeX5Y8cWQVODkJfH` (provider `Seth`,
    # model `seth-livre`), com o MCP `canon` anexado (`query_canon`,
    # `vault_consultar`). A (392) tinha removido o Agent anterior
    # (`agent_0Kdj6GbqpUe2rgKRIFmvk`) na migracao pra modelSpec -- e com isso a
    # Seth perdeu acesso as ferramentas de MCP (elas so se anexam a Agent, nao a
    # endpoint `custom` puro). A spec default abaixo volta a apontar pro Agent;
    # a cascata do OmniRoute (`seth-livre`: zai->gemini->hf->mistral) segue por
    # baixo, via o provider `Seth` do Agent. As specs seth-zai/gemini/etc.
    # continuam `endpoint: Seth` (custom, sem MCP) -- troca manual pra debug.
    - name: "seth-livre"
      label: "Seth (cascata livre)"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      default: true
      description: "Agente Seth + MCP canon. Cascata zai->gemini->hf->mistral por baixo. O default."
      preset:
        endpoint: "agents"
        agent_id: "agent_4KlxSMeX5Y8cWQVODkJfH"
    - name: "seth-zai"
      label: "Seth · zai/glm-4.7-flash"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      preset:
        endpoint: "Seth"
        model: "zai/glm-4.7-flash"
    - name: "seth-gemini"
      label: "Seth · gemini-2.5-flash"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      preset:
        endpoint: "Seth"
        model: "gemini/gemini-2.5-flash"
    - name: "seth-hf"
      label: "Seth · Llama-3.3-70B (HuggingFace)"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      preset:
        endpoint: "Seth"
        model: "huggingface/meta-llama/Llama-3.3-70B-Instruct"
    - name: "seth-mistral"
      label: "Seth · ministral-8b (Mistral)"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      preset:
        endpoint: "Seth"
        model: "mistral/ministral-8b-latest"
    - name: "seth-auto"
      label: "Seth · auto/best-free (auto-roteador OmniRoute)"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"
      description: "So quando o auto-roteador do OmniRoute estiver saudavel de novo."
      preset:
        endpoint: "Seth"
        model: "auto/best-free"

# Memoria persistente: desligada de proposito. Ver acima.
memory:
  disabled: true

endpoints:
  # HITL tool approval (MEMÓRIAS (487)) -- toda chamada de ferramenta MCP de
  # qualquer Agent (a Seth incluída) para e espera Aprovar/Rejeitar/Editar do
  # Humano antes de rodar. Testado de ponta a ponta numa cópia isolada antes
  # de entrar aqui -- schema aceito sem erro, aprovação e rejeição confirmadas
  # funcionando (rejeitar => "Cancelado", ferramenta nunca chamada de verdade).
  # `checkpointer: mongo` (MEMÓRIAS (523)) -- era `memory`, e com `memory` a
  # aprovação NUNCA funcionou em produção: nesta versão `getAgentCheckpointer`
  # devolve nada pra `memory`, o cliente é descartado logo depois de pausar, e a
  # retomada reconstrói o agente sem estado -> encerra em 20ms sem rodar a
  # ferramenta e a UI mostra "Cancelado" (5 de 5 tentativas em 23/09). `mongo` é
  # o padrão da própria LibreChat: grava a pausa no MongoDB que já sobe junto
  # (`librechat-mongodb`), com TTL próprio -- sobrevive entre requisições.
  agents:
    toolApproval:
      enabled: true
      mode: default
      ask:
        - "*"
    checkpointer:
      type: mongo
  custom:
    - name: "Seth"
      apiKey: "loopback-sem-chave"
      baseURL: "http://172.29.7.1:20126/v1"
      iconURL: "/images/6a99c8514070d04134d59265/agent-agent_4KlxSMeX5Y8cWQVODkJfH-avatar-1788979966338.png"   # fallback do rosto quando a UI nao passa por spec
      # Default = `seth-livre` (MEMÓRIAS (390)): combo CUSTOM do OmniRoute
      # (storage.sqlite, curada por nós), strategy=priority, cascata
      # zai/glm-4.7-flash -> gemini/gemini-2.5-flash -> huggingface/Llama-3.3-70B
      # -> mistral/ministral-8b-latest -- os 4 confirmados ao vivo em (379)/(390).
      # Substitui `auto/best-free` como default: aquele deriva a lista de
      # candidatos sozinho (radar/discovery do OmniRoute) e apodreceu -- 08/09
      # tentava cerebras/zai-glm-4.7 (arquivado), groq/llama-3.3-70b-versatile
      # (404) e oc/big-pickle (400 no prompt_cache_key), deixando a Seth muda.
      # `auto/best-free` fica no fim, pra quando o auto-roteador se recuperar.
      # `fetch: false`: o seletor mostra SÓ esta lista curada, não os ~300 do
      # catálogo cru (a maioria fantasma). Os `auto/claude-*` sao PAGOS.
      # Reproduzir a combo: config/modelos-gratuitos.md, "seth-livre".
      models:
        default:
          - "seth-livre"
          - "zai/glm-4.7-flash"
          - "gemini/gemini-2.5-flash"
          - "huggingface/meta-llama/Llama-3.3-70B-Instruct"
          - "mistral/ministral-8b-latest"
          - "auto/best-free"
          - "auto/vision"
          - "auto/claude-sonnet"
          - "auto/claude-opus"
        fetch: false
      # titleConvo LIGADO. Foi desligado na (411) por um diagnóstico errado
      # (que a geração de título abortava a resposta principal); a (412)
      # retratou -- a fonte do LibreChat não sustenta esse mecanismo, a causa
      # real da Seth muda era a cascata de provedores lenta naquela janela.
      # Religado na (413). A chamada de título passa pelo :20126 mas o
      # seth_gateway NÃO a hidrata (filtro `_e_chamada_utilitaria`, (411)):
      # fica pequena e rápida, sem carregar REGRAS+PROJETO+estado.
      titleConvo: true
      titleModel: "seth-livre"
      modelDisplayLabel: "Seth"
      forcePrompt: false

# Voz: TTS pelo Piper (shim OpenAI-compat em :8890, redesign/router/tts_piper.py) --
# voz pt-BR real (pt_BR-faber-medium, corpus CML-TTS), CPU, RTF ~0,13, zero VRAM.
# MEMÓRIAS (387): as vozes pt-BR do Kokoro (pf_dora etc.) nao tem nota de qualidade
# no model card e pronunciam portugues errado; Kokoro seguia em CPU numa maquina
# com RTX 4060 -> tambem lento. Kokoro (:8880) segue no ar pra ingles -- e' so
# trocar a url abaixo de volta pra 8880 e a lista de vozes pelas af_/am_.
# STT (whisper :20130) ainda nao e OpenAI-compat em /v1 -- pendente, ver redesign/librechat/README.md
#
# (414) trocou pra Kokoro `pf_dora` em teste; (415) REVERTEU pro Piper -- ordem
# do Humano ("reverta a dora pro modelo anterior, ela estava funcionando
# lindamente pela manha"). Volta ao estado da (387): Piper `pt_BR-faber-medium`
# (:8890), voz pt-BR masc., CPU, rapido. Kokoro (:8880) segue no ar. Se o pedido
# de voz feminina pt-BR voltar: caminho e XTTS-v2 (opcao B da (412)/(413)), nao
# pf_dora em CPU.
speech:
  tts:
    openai:
      url: "http://172.29.7.1:8890/v1/audio/speech"
      apiKey: "loopback-sem-chave"
      model: "tts-1"
      voices:
        - "pt-br"
        - "dora"

# --- MCP: memória local (vault Obsidian, read-only) ------------------------
# canon-mcp.mjs bate no proxy read-only :27125 (obsidian-ro-proxy). Zero deps.
# Tools: query_canon (docs do canon direto da fonte) · vault_consultar (notas derivadas).
# startup: false = sob demanda (LibreChat inicializa na 1a chamada). Se a Seth nao
# achar a tool, virar startup: true -- e read-only, ~30 MB, e a espinha da hidratacao.
mcpServers:
  canon:
    type: stdio
    command: node
    args:
      - /app/data/mcp/canon-mcp.mjs
    env:
      CANON_PROXY: http://172.29.7.1:27125
      SETH_ESCRIBA: http://172.29.7.1:20140      # sem isto o canon-mcp usa 127.0.0.1 (padrão dele) e a escrita some
      SETH_VERIFICADOR: http://172.29.7.1:20141  # idem pra maquina_verificar
    startup: true   # ligado: read-only, ~40 MB, e a espinha da hidratacao da Seth
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Vault do Agata (canon read-only) via :27125 -- query_canon, vault_consultar"
  discord:
    type: streamable-http
    url: http://172.29.7.1:20135/mcp
    startup: false   # sob demanda -- via 172.29.7.1 (rele librechat-ponte-host, B8)
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Ponte Discord (poll, nao push) -- ler_mensagens, enviar_mensagem sanitizada. Skill nova, 05/09/2026."
  navegador:
    type: streamable-http
    url: http://172.29.7.1:20136/mcp
    startup: false   # sob demanda -- Brave real roda no host, nao dentro do container
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Controle de navegador (Playwright + Brave, perfil isolado) -- navegar, ler_pagina, clicar/preencher travados por allowlist de dominio. Skill nova, 05/09/2026."
