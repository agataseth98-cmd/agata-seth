# librechat.yaml -- config do LibreChat do sistema Agata.
# Fonte versionada: ~/agata/redesign/librechat/librechat.yaml
# Runtime: ~/librechat/librechat.yaml  (montado em /app/librechat.yaml :ro)
#
# Principios espelhados do sistema:
#  - memoria DESLIGADA: a hidratacao da Seth vem do seth_gateway (:20126),
#    que injeta canon-em-git verificavel. Nada de auto-captura por LLM (MEMORIAS (312)).
#  - SEM RAG por embedding: MEMORIAS (115)/(293) recusaram busca semantica.
#    O rag_api e o pgvector nao sao implantados.
#  - um unico endpoint "Seth" -> :20126 (loopback: seth_gateway -> sanitizador -> OmniRoute).

version: 1.3.13
cache: true

# Servidores MCP remotos (discord/navegador, skills novas 05/09/2026) so
# respondem em 127.0.0.1 -- host-side, network_mode: host. Sem isto, o
# LibreChat bloqueia qualquer server MCP com `url:` por seguranca (SSRF).
mcpSettings:
  allowedDomains:
    - "127.0.0.1"

interface:
  mcpServers:
    use: true
  customWelcome: "Seth -- sistema Agata. Hidratada pelo seth_gateway (:20126). A Regra 1 vale: toda resposta abre com modelo - turno - ultima entrada de MEMORIAS - o que esta quebrado."
  privacyPolicy:
    externalUrl: ""
  termsOfService:
    externalUrl: ""

registration:
  socialLogins: []

# Memoria persistente: desligada de proposito. Ver acima.
memory:
  disabled: true

endpoints:
  custom:
    - name: "Seth"
      apiKey: "loopback-sem-chave"
      baseURL: "http://127.0.0.1:20126/v1"
      # `auto/*` sao meta-roteadores do OmniRoute com fallback embutido (nao os
      # combos custom). `auto/best-free` = so provedores GRATIS confirmados, com
      # cascata ate o modelo local -- e' o default da Seth desde MEMÓRIAS (376),
      # pra ela nunca ficar sem resposta quando um provedor grátis cai (o dia
      # inteiro de 08/09 os 4 caíram). Os `auto/claude-*` sao PAGOS -- deixados
      # na lista mas nunca como default.
      # HuggingFace e Mistral entraram como provedores gratis confirmados em
      # MEMÓRIAS (379) -- o `auto/best-free` ja os pega sozinho (conexoes ativas
      # no OmniRoute); as entradas explicitas abaixo sao so pra selecao manual.
      models:
        default:
          - "auto/best-free"
          - "auto/chat"
          - "auto/smart"
          - "auto/cheap"
          - "auto/reasoning"
          - "auto/coding"
          - "auto/vision"
          - "huggingface/meta-llama/Llama-3.3-70B-Instruct"
          - "mistral/ministral-8b-latest"
          - "auto/claude-sonnet"
          - "auto/claude-opus"
        fetch: true
      titleConvo: true
      titleModel: "auto/fast"
      modelDisplayLabel: "Seth"
      forcePrompt: false

# Voz: TTS pelo Piper (shim OpenAI-compat em :8890, redesign/router/tts_piper.py) --
# voz pt-BR real (pt_BR-faber-medium, corpus CML-TTS), CPU, RTF ~0,13, zero VRAM.
# MEMÓRIAS (387): as vozes pt-BR do Kokoro (pf_dora etc.) nao tem nota de qualidade
# no model card e pronunciam portugues errado; Kokoro seguia em CPU numa maquina
# com RTX 4060 -> tambem lento. Kokoro (:8880) segue no ar pra ingles -- e' so
# trocar a url abaixo de volta pra 8880 e a lista de vozes pelas af_/am_.
# STT (whisper :20130) ainda nao e OpenAI-compat em /v1 -- pendente, ver redesign/librechat/README.md
speech:
  tts:
    openai:
      url: "http://127.0.0.1:8890/v1/audio/speech"
      apiKey: "loopback-sem-chave"
      model: "tts-1"
      voices:
        - "pt-br"
        - "dora"

# --- MCP: memória local (vault Obsidian, read-only) ------------------------
# canon-mcp.mjs bate no proxy read-only :27125 (obsidian-ro-proxy). Zero deps.
# Tools: query_canon (docs do canon direto da fonte) · vault_consultar (notas derivadas).
# startup: false = sob demanda (LibreChat inicializa na 1a chamada). Se a Seth nao
# achar a tool, virar startup: true -- e read-only, ~30 MB, e a espinha da hidratacao.
mcpServers:
  canon:
    type: stdio
    command: node
    args:
      - /app/data/mcp/canon-mcp.mjs
    env:
      CANON_PROXY: http://127.0.0.1:27125
    startup: true   # ligado: read-only, ~40 MB, e a espinha da hidratacao da Seth
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Vault do Agata (canon read-only) via :27125 -- query_canon, vault_consultar"
  discord:
    type: streamable-http
    url: http://127.0.0.1:20135/mcp
    startup: false   # sob demanda -- network_mode: host, 127.0.0.1 do container == do host
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Ponte Discord (poll, nao push) -- ler_mensagens, enviar_mensagem sanitizada. Skill nova, 05/09/2026."
  navegador:
    type: streamable-http
    url: http://127.0.0.1:20136/mcp
    startup: false   # sob demanda -- Brave real roda no host, nao dentro do container
    chatMenu: true
    serverInstructions: true
    timeout: 30000
    description: "Controle de navegador (Playwright + Brave, perfil isolado) -- navegar, ler_pagina, clicar/preencher travados por allowlist de dominio. Skill nova, 05/09/2026."
