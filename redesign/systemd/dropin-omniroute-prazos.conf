# Agata -- OmniRoute: prazo para um modelo começar a responder (MEMÓRIAS (683)).
#
# Medido em 14/10/2026 (call logs do OmniRoute): o Gemini 2.5 Flash, com a cota
# gratuita do dia estourada, ficou 310 s com o stream aberto sem mandar nada; o
# LibreChat desistiu antes ("Request aborted", 499) e a resposta da Seth morreu,
# com o Nemotron-Super logo atrás pronto para responder em ~2 s.
#
# Lido no código do pacote (src/shared/utils/runtimeTimeouts.ts e
# open-sse/config/constants.ts): STREAM_IDLE_TIMEOUT_MS é o prazo, ANTES de o
# stream ser aceito, para o primeiro evento útil ("zombie streams fail fast and
# trigger fallback") e, depois, o de silêncio no meio do stream. Padrão: 600000
# (10 min) -- mais que o LibreChat espera. 60 s: o modelo que não começa em 1
# minuto cai e a fila passa ao próximo; um modelo lento de verdade raramente fica
# 1 minuto calado no meio da resposta.
#
# Instala com: cp dropin-omniroute-prazos.conf
# ~/.config/systemd/user/omniroute.service.d/prazos.conf + systemctl --user
# daemon-reload + restart do omniroute. Desfaz: apagar o arquivo e reiniciar.
[Service]
Environment=STREAM_IDLE_TIMEOUT_MS=60000
