# Drop-in comum -- copiar para
#   ~/.config/systemd/user/<unit>.service.d/agata.conf
# em: omniroute, omniroute-sanitizer, openvino-whisper, openvino-embeddings,
#     obsidian-ro-proxy (e llamacpp-agata, opcional).
[Unit]
PartOf=agata.target
[Install]
WantedBy=agata.target
[Service]
# dreno: ao parar, deixa o loop terminar o efeito em curso (WAL) antes de cortar
ExecStop=/home/orusoua/agata/redesign/grafo/.venv/bin/python /home/orusoua/agata/redesign/grafo/cli.py down
TimeoutStopSec=45
