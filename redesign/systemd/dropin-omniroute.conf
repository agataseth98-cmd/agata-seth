# P7-01: liga ao agata.target + trata a saida 143 (SIGTERM) do 'omniroute stop'
# como parada limpa. omniroute e' Type=simple e o ExecStop mata o proprio main,
# que sai com code=exited status=143 -- sem isto o systemd marca 'failed'.
[Unit]
PartOf=agata.target

[Service]
SuccessExitStatus=143 SIGTERM

[Install]
WantedBy=agata.target
